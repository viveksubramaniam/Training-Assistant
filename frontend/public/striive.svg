<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0f172a"/>
  <!-- Eclipse glow -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#glow)" stroke-width="5"/>
  <!-- Eclipse crescent overlay -->
  <circle cx="38" cy="28" r="18" fill="#0f172a"/>
  <!-- Bright accent point -->
  <circle cx="18" cy="38" r="4" fill="#f97316" opacity="0.9"/>
  <circle cx="18" cy="38" r="8" fill="#f97316" opacity="0.2"/>
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
</svg>
